slug: form-screen
title: Form screen design
version: 1
threshold: 80
criteria:
  - key: form-structure
    title: Form structure
    weight: 20
    competency: ui-forms
    description: |
      Does the form have a visible label for every field, sensible grouping, the optional field marked as optional, and one clear main action with a specific label?
      Strong (85-100): labels stay visible, groups are clear, the optional field is marked and the button says what happens next.
      Adequate (60-84): sound, but a label is placeholder-only, grouping is weak, or the button is vague.
      Weak (0-59): fields lack labels, the structure is unclear, or the main action is hard to find.
  - key: navigation-clarity
    title: Navigation clarity
    weight: 15
    competency: ui-navigation
    description: |
      Is there a navigation bar of labelled items with the current item marked in more than one way, and a visible way back to the departures?
      Strong (85-100): labelled items, a current mark that does not rely on colour alone, and a clear way back. Adequate (60-84): navigation present but the current item relies on colour or the way back is faint. Weak (0-59): no navigation, icons only, or no way back.
  - key: feedback-and-recovery
    title: Feedback and error recovery
    weight: 20
    mandatory: true
    minScore: 60
    competency: ui-feedback
    description: |
      Is one field shown in an error state with a non-colour cue and a message that says what is wrong and how to fix it, and is there a loading or success cue for the main action?
      Strong (85-100): the error has an icon or other cue and a specific fix, sits next to its field, and the saving or success cue is visible. Adequate (60-84): the error is clear but vague about the fix or relies mostly on colour, or the loading cue is faint. Weak (0-59): no error state, a message like "Error", or no loading or success cue.
  - key: targets-and-states
    title: Touch targets and states
    weight: 15
    mandatory: true
    minScore: 60
    competency: ui-touch-targets-and-states
    description: |
      Are interactive elements large enough (about 44 by 44 points) with room between them, and are states distinct? You cannot measure exact sizes from pixels: judge what is visible, say it is an estimate, and compare with the sizes the rationale reports.
      Strong (85-100): all targets are comfortably sized and spaced and every state is distinct without relying on colour alone. Adequate (60-84): targets are probably adequate but one is tight, or a state relies mostly on colour. Weak (0-59): targets are visibly small or crowded, or states cannot be told apart.
  - key: readable-text-and-contrast
    title: Readable text and contrast
    weight: 10
    competency: accessibility-contrast
    description: |
      Is body text a readable size (about 16 points or more) and does essential text meet accessibility minimums (about 4.5:1 for normal text, 3:1 for large text)? You cannot measure exact ratios from pixels. Judge what is visible, say it is an estimate, flag anything borderline, and check that measured ratios in the rationale are plausible.
      Strong (85-100): essential text is clearly well above the minimums and comfortably sized. Adequate (60-84): probably adequate with one borderline pair. Weak (0-59): essential text visibly fails or is too small.
  - key: legibility-at-small-size
    title: Legibility at small size
    weight: 10
    description: |
      Judge the small-scale preview only from the preview image itself. Does the structure still read: the form, the navigation and the main action?
      Strong (85-100): the structure and the main action survive clearly. Adequate (60-84): the structure survives but one part is strained. Weak (0-59): the structure is lost, or the preview is missing or not a smaller version of the final.
  - key: design-rationale
    title: Design rationale
    weight: 10
    description: |
      Does the rationale explain three real decisions, report the measurements used (target sizes, font sizes, at least two contrast ratios), and match what is visible? Judge reasoning, not writing style.
      Strong (85-100): three specific decisions with reasons and measurements that match the work. Adequate (60-84): decisions named, measurements thin or missing. Weak (0-59): generic statements, or claims the work does not show.
