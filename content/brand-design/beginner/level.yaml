discipline: brand-design
path: brand-design
tier: BEGINNER
scopeLabel: Identity foundations
scopeNote: >
  Two Beginner modules are authored so far: Brand Identity Foundations and Imagery and Brand Layouts. Both
  must be complete before this capstone opens, but the capstone itself still assesses only the identity skills
  from the first module. Passing it records evidence that you can keep a small identity consistent across
  applications. It does not show mastery of brand strategy, naming, research or the full Beginner curriculum,
  which is not written yet.
objectives:
  - Express a brand's position and audience through design decisions.
  - Use a logo and lockup correctly, including at small sizes and on different backgrounds.
  - Build a small colour and type system and apply it consistently across different formats.
capstoneThreshold: 85
requiredCompetencies: [brand-system-consistency]
status: DRAFT
