discipline: graphic-design
path: graphic-design
tier: BEGINNER
scopeLabel: Contrast foundations
scopeNote: >
  Two Beginner modules are authored so far: Understanding Contrast and Typography and Layout. Both
  must be complete before this capstone opens, but the capstone itself still assesses only the
  contrast skills from the first module. Passing it records evidence of contrast foundations. It
  does not show mastery of the full Beginner curriculum, which is not written yet.
objectives:
  - Use contrast deliberately to build hierarchy, grouping and legibility.
  - Check text contrast against accessibility minimums and fix failures.
  - Keep a coordinated set of pieces consistent across different formats.
capstoneThreshold: 85
requiredCompetencies: [accessibility-contrast]
status: DRAFT
